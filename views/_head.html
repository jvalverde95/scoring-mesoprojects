<!-- Overlay para copiar enlace de snapshot manualmente -->
<div id="snapshot-link-overlay" style="display:none;position:fixed;inset:0;z-index:800;background:rgba(8,8,8,.7);align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:12px;padding:24px;max-width:560px;width:90%">
    <div style="font-size:15px;font-weight:800;color:#1C2B4A;margin-bottom:8px">🔗 Enlace para compartir</div>
    <div style="font-size:12px;color:#666;margin-bottom:14px">Copia este enlace y envíalo a los directores. Al abrirlo verán la vista En Marcha tal cual está ahora.</div>
    <input id="snapshot-link-input" type="text" readonly onclick="this.select()"
      style="width:100%;padding:10px;font-size:11px;border:1px solid #DEDEDE;border-radius:8px;font-family:monospace;box-sizing:border-box">
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px">
      <button onclick="document.getElementById('snapshot-link-input').select();document.execCommand('copy');toast('Enlace copiado')" class="cfg-apply" style="font-size:11px;padding:8px 16px;background:#16243E;color:#fff;border:none;border-radius:8px">Copiar</button>
      <button onclick="document.getElementById('snapshot-link-overlay').style.display='none'" class="cfg-apply cfg-reset" style="font-size:11px;padding:8px 16px">Cerrar</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
